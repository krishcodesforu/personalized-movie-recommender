name: Recommender pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Build recommender from public data
        run: cinematch build
      - name: Calculate ranking metrics
        run: cinematch evaluate
      - name: Publish aggregate evaluation metrics
        uses: actions/upload-artifact@v4
        with:
          name: cinematch-evaluation
          path: artifacts/evaluation.json
          if-no-files-found: error
